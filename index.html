<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOC Business Consulting</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: #f9f9f9; color: #333; }
    header { background: #0B1F36; color: #fff; padding: 2rem; text-align: center; }
    nav { background: #0B1F36; padding: 1rem; text-align: center; position: sticky; top: 0; z-index: 1000; }
    nav a { color: white; margin: 0 1rem; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    .hero-img { width: 100%; max-height: 400px; object-fit: cover; }
    section { padding: 2rem; max-width: 1000px; margin: auto; }
    h2 { color: #0B1F36; margin-bottom: 1rem; }
    ul { padding-left: 1.2rem; margin-bottom: 1.5rem; }
    li { margin-bottom: 0.5rem; }
    footer { background: #eee; padding: 2rem; text-align: center; font-size: 0.9rem; }
    #cta-button { position: fixed; bottom: 30px; right: 30px; background-color: #0B1F36; color: white; padding: 1rem 1.5rem; border-radius: 30px; text-decoration: none; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: background-color 0.3s; z-index: 9999; }
    #cta-button:hover { background-color: #155ab6; }
    a[href^="mailto"] { color: #0B1F36; text-decoration: none; }
    a[href^="mailto"]:hover { color: #ccc; }
  </style>
</head>
<body>
